# XHTTP 伪装站设置
server {
    listen                  unix:/dev/shm/nginx/cdn_to_nginx.sock ssl backlog=2048 so_keepalive=on proxy_protocol;
    http2                   on;

    set_real_ip_from        unix:;
    include                 /usr/local/nginx/modules-enabled/cdn_ip_list.conf;
    real_ip_header          X-Forwarded-For;
    real_ip_recursive       on;

    server_name             <XHTTP_CDN_Site>;
    root                    /usr/local/nginx/public/<XHTTP_CDN_Site>;

    # SSL
    ssl_certificate         /usr/local/nginx/ssl/<XHTTP_CDN_Site>/fullchain.cer;
    ssl_certificate_key     /usr/local/nginx/ssl/<XHTTP_CDN_Site>/private.key;
    ssl_trusted_certificate /usr/local/nginx/ssl/<XHTTP_CDN_Site>/ca.cer;
    ssl_early_data          on;

    include                 /usr/local/nginx/conf/security.conf;

    # logging
    access_log              /usr/local/nginx/logs/access.log custom buffer=512k flush=1m;
    error_log               /usr/local/nginx/logs/error.log warn;

    location / {
        index               index.html;
    }

    # additional config
    include                 /usr/local/nginx/conf/general.conf;

    # 以下参数请根据服务器内存大小自行调整
    http2_max_concurrent_streams 1024;
    http2_body_preread_size      128k;
    keepalive_time               1h;
    keepalive_timeout            600s;
    keepalive_requests           40960;
    client_body_buffer_size      1m;
    client_body_timeout          600s;
    client_header_timeout        300s;
    large_client_header_buffers  8 16k;
    proxy_connect_timeout        30s;
    proxy_read_timeout           1h;
    proxy_send_timeout           1h;
    proxy_buffering              off;
    proxy_request_buffering      off;

    # xhttp 设置
    location /<XHTTP_PATH> {
        client_max_body_size     0;
        grpc_pass                grpc://unix:/dev/shm/nginx/to_xray_xhttp.sock;

        grpc_buffer_size         128k;
        grpc_socket_keepalive    on;
        grpc_read_timeout        1h;
        grpc_send_timeout        1h;

        grpc_set_header X-Real-IP         $remote_addr;
        grpc_set_header Forwarded         $proxy_add_forwarded;
        grpc_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_set_header X-Forwarded-Host  $host;
        grpc_set_header X-Forwarded-Port  $server_port;
        grpc_set_header Host              $http_host;
        grpc_set_header Early-Data        $ssl_early_data;
    }

    location = /<Subs_Site_PATH> {
        alias /usr/local/nginx/public/subscription/subs.txt;
        charset utf-8;
        # 强制设置浏览器识别为纯文本
        default_type text/plain;
        # 明确告诉浏览器在页内展示
        add_header Content-Disposition "inline";
    }
}